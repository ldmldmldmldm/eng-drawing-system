server {
  listen 80;
  server_name _;
  # STP 最大约 80MB；留余量
  client_max_body_size 100m;
  root /usr/share/nginx/html;
  index index.html;

  # 静态资源压缩：入口 JS ~1.5MB 未压时经 JumpServer 易白屏数十秒
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/xml+rss
    image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # 前端 baseURL=/api；后端 Controller 无 /api 前缀，须剥掉前缀（与 vite rewrite 一致）
  location /api/ {
    proxy_pass http://eng-drawing-backend:6053/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;
    proxy_buffering off;
  }
}
