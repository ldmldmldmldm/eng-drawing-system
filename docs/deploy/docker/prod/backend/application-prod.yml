# 服务器挂载：/data01/eng-drawing/backend/application-prod.yml
# 共用 eq-pm2 的 MySQL 容器：eq-pm2-mysql（同网 eq-pm2-net）
# 库名 eng_drawing；宿主机端口 23306
# MySQL 口令与 eq-pm2 MYSQL_ROOT_PASSWORD 一致
# LLM 回退：本文件不覆盖密钥；沿用 jar 内 application.yml 的 ai-drawing.deepseek-*（与库内启用模型一致；亦可被环境变量覆盖）

spring:
  datasource:
    url: jdbc:mysql://eq-pm2-mysql:3306/eng_drawing?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&allowPublicKeyRetrieval=true
    username: root
    password: 'huxiongjun@2026'
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.nineai.entity
  global-config:
    db-config:
      id-type: auto
  base-package: org.nineai.mapper

logging:
  file:
    path: /app/logs
  level:
    org.nineai: info
    org.springframework: warn
    com.baomidou.mybatisplus: warn

ai-drawing:
  storage-dir: /data/eng-drawing
  # ODA 已打进后端镜像；无头须走 xvfb 包装脚本（勿直接调 /opt/oda/ODAFileConverter）
  oda-converter: /usr/local/bin/oda-file-converter
  python: /opt/aidrawing-py/bin/python3
  # 与 nine-ai-prod 生产一致：共用 10.0.2.85 上的 PaddleOCR（本机 161 无 AVX 不起自建 OCR）
  ocr-base-url: http://10.0.2.85:8868
  heavy:
    global-slots: 3
    extract-max-running: 3
    compose-max-running: 2
    extract-max-queued: 15
    compose-max-queued: 10
    light-max-running: 4

