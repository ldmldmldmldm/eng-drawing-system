# 本地开发。共用 nine-ai 本地 Docker MySQL（127.0.0.1:23306），独立库 eng_drawing

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:23306}/eng_drawing?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&autoReconnect=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: org.nineai.entity
  global-config:
    db-config:
      id-type: auto
  base-package: org.nineai.mapper

logging:
  file:
    path: ${LOG_PATH:./logs}
  level:
    org.nineai: info
    org.nineai.mapper: warn
    org.springframework: warn
    com.baomidou.mybatisplus: warn

ai-drawing:
  storage-dir: ${AI_DRAWING_DIR:data/eng-drawing}
